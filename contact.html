<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Pavan Kumar through the accessible portfolio contact form.">
  <title>Contact | Pavan Kumar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header"><div class="container nav-container">
    <a class="logo" href="index.html" aria-label="Pavan Kumar home page">PK</a>
    <nav aria-label="Main navigation"><ul class="nav-links">
      <li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="skills.html">Skills</a></li><li><a href="projects.html">Projects</a></li><li><a href="contact.html" aria-current="page">Contact</a></li>
    </ul></nav>
  </div></header>
  <main id="main-content">
    <section class="page-header"><div class="container"><h1>Contact Me</h1><p>Send me a message using the form below.</p></div></section>
    <section class="section container form-section" aria-labelledby="contact-title">
      <h2 id="contact-title">Send a Message</h2>
      <p id="form-help">All fields marked with an asterisk (*) are required.</p>
      <form id="contact-form" novalidate aria-describedby="form-help">
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input id="name" name="name" type="text" autocomplete="name" required aria-required="true">
          <p class="error" id="name-error" aria-live="polite"></p>
        </div>
        <div class="form-group">
          <label for="email">Email Address *</label>
          <input id="email" name="email" type="email" autocomplete="email" required aria-required="true">
          <p class="error" id="email-error" aria-live="polite"></p>
        </div>
        <div class="form-group">
          <label for="subject">Subject *</label>
          <input id="subject" name="subject" type="text" required aria-required="true">
          <p class="error" id="subject-error" aria-live="polite"></p>
        </div>
        <div class="form-group">
          <label for="message">Message *</label>
          <textarea id="message" name="message" rows="6" required aria-required="true"></textarea>
          <p class="error" id="message-error" aria-live="polite"></p>
        </div>
        <button class="button" type="submit">Send Message</button>
        <p id="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <footer class="site-footer"><div class="container"><p>&copy; <span id="year"></span> Pavan Kumar. All rights reserved.</p></div></footer>
  <script src="script.js"></script>
</body>
</html>
